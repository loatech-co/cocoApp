# SwiftLint — the rules of the Swift code (CONTRIBUTING.md, "iOS"). Formatting
# belongs to swift-format (.swift-format); the rules that are not formatting go
# here.
#
# Pinned version: SwiftLint is still 0.x and a new version can bring new rules
# that break CI without the code having changed. It is bumped on purpose, in
# its own PR.
swiftlint_version: 0.65.1

# Strict: every warning is an error. There are no warnings that can be ignored.
strict: true

included:
  - Coco
  - CocoWidgets
  - CocoTests
excluded:
  - Coco.xcodeproj
  - build
  - DerivedData

disabled_rules:
  # Owned by swift-format: it adds the trailing comma in multi-line
  # collections and moves the brace to its own line after a wrapped
  # signature. With these two on, the tools would fight each other.
  - trailing_comma
  - opening_brace

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - sorted_first_last
  - toggle_bool
  - discouraged_optional_boolean
  - private_swiftui_state

line_length:
  warning: 120
  ignores_urls: true

# One letter is fine in a short closure (`c` for a `Codable`'s container,
# `a, b` when sorting). What is required is camelCase: the API's snake_case
# keys go in `CodingKeys`, not in the property's name.
identifier_name:
  min_length: 1
  max_length: 50
type_name:
  max_length: 50

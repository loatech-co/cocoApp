# The tests inherit ../.swiftlint.yml. Only what in a test
# is data and not code is relaxed:
# - line_length: the sample JSONs go on one line, just as the API
#   returns them. swift-format already wraps the code at 120; the only thing left long
#   is those strings.
# - type_body_length and file_length: a test class is a list of
#   cases; splitting it by size separates cases that are read together.
disabled_rules:
  - line_length
type_body_length:
  warning: 450
  error: 500
file_length:
  warning: 500
  error: 600

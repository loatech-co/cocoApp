# Xcode project specification. The .xcodeproj is GENERATED from here:
#
#   brew install xcodegen && xcodegen generate
#
# and it is versioned too, so that opening the project does not require anything installed.
# If the .xcodeproj is edited by hand, the next `xcodegen generate` overwrites it:
# whatever is meant to be kept goes here.
name: Coco
options:
  bundleIdPrefix: co.loatech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  # The texts are in Spanish (Localizable.xcstrings): it is the base language.
  developmentLanguage: es
# Signing (team, style, identity, profile) does NOT go in `settings`: whatever
# is here ends up written into the .xcodeproj and overrides any xcconfig. It goes in
# Signing.xcconfig, which optionally includes a git-ignored Local.xcconfig
# with each person's Team ID (see Local.xcconfig.example). That way
# regenerating does not erase the signing, and without that file the simulator still
# builds.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    # Language mode 6: strict concurrency is a compile error,
    # not a warning. An `@unchecked Sendable` has why it is safe written down.
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The API the app talks to; the Info.plist reads it from here. It is overridden
    # from the command line for the smoke test against the local API:
    #   xcodebuild ... COCO_API_BASE_URL=http://localhost:3000
    COCO_API_BASE_URL: https://dev-cocoapp.viteri.me
    # The catalogs (Localizable.xcstrings) are written by hand, with keys in
    # English. Without this, Xcode adds to them by itself every literal it finds —a
    # `Text("$")`, the intent titles— and the catalog stops being the
    # list of what `L10n` asks for.
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Coco:
    type: application
    platform: iOS
    sources:
      - path: Coco
    dependencies:
      # The quick-access extension (M13) goes inside the .app.
      - target: CocoWidgets
        embed: true
    info:
      path: Coco/Resources/Info.plist
      properties:
        CFBundleDisplayName: Coco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Our own scheme: the notifications, the widget and the control open the app through here.
        CFBundleURLTypes:
          - CFBundleURLName: co.loatech.coco
            CFBundleURLSchemes: [coco]
        # Refresh the warm token and empty the queue when iOS grants it.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [co.loatech.coco.refresh, co.loatech.coco.queue]
        # To be able to open the Shortcuts app from Welcome.
        LSApplicationQueriesSchemes: [shortcuts]
        NSCameraUsageDescription: Para fotografiar un recibo y leerlo.
        NSPhotoLibraryUsageDescription: Para adjuntar la foto de un recibo cuando no hay cámara.
        NSFaceIDUsageDescription: Para proteger tu sesión.
        # Only local network without TLS (the API on localhost from the simulator); the
        # rest still demands HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # The API the app talks to (see COCO_API_BASE_URL above). It
        # can be changed in Settings inside the app.
        CocoAPIBaseURL: $(COCO_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.loatech.coco
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  # Quick access (M13): the Control Center / lock screen / action button
  # control (iOS 18) and the home widget + lock screen
  # accessories (iOS 17). They only open the app through coco://, so it
  # carries no entitlements (no App Groups: the free personal team does not
  # guarantee them). It uses the second App ID of the team's 10 per week
  # (personal team).
  #
  # If Xcode refuses to sign the extension with the personal team, remove
  # this target and the dependency above: the action button keeps
  # working through the app's App Shortcuts.
  CocoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CocoWidgets
    info:
      path: CocoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Accesos de Coco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.loatech.coco.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # Its own catalog with the same brand color as the app: the
        # extension does not see the .app's resources.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  CocoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CocoTests
      # VisibleTextTests reads the code of the app and of the extension. The
      # simulator cannot read it where it is (Documents is protected), so
      # it is copied inside the test bundle as a folder.
      - path: Coco
        type: folder
        buildPhase: resources
      - path: CocoWidgets
        type: folder
        buildPhase: resources
    dependencies:
      - target: Coco
    # The web half of the bridge and the v2 contract, for the same reason:
    # ContractsTests and WebBridgeSmokeTests read them from the bundle.
    postCompileScripts:
      - name: Copiar la web para las pruebas del puente
        script: bash "$SRCROOT/scripts/copy-web-for-tests.sh"
        basedOnDependencyAnalysis: false
    info:
      path: CocoTests/Info.plist
      properties:
        # A base different from the app's, to test that it reads from the bundle
        # it asks for and not from the app's.
        CocoAPIBaseURL: https://pruebas.coco.invalid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.loatech.coco.tests
        # The script above reads `frontend/`, outside what it declares.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Coco:
    build:
      targets:
        Coco: all
        CocoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CocoTests]

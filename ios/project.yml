# Especificación del proyecto de Xcode. El .xcodeproj se GENERA de aquí:
#
#   brew install xcodegen && xcodegen generate
#
# y se versiona también, para que abrir el proyecto no exija nada instalado.
# Si se edita el .xcodeproj a mano, el siguiente `xcodegen generate` lo pisa:
# lo que se quiera conservar va aquí.
name: Coco
options:
  bundleIdPrefix: co.loatech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  # Los textos están en español (Localizable.xcstrings): es la lengua base.
  developmentLanguage: es
# La firma (equipo, estilo, identidad, perfil) NO va en `settings`: lo que
# está aquí acaba escrito en el .xcodeproj y pisa cualquier xcconfig. Va en
# Signing.xcconfig, que incluye de forma opcional un Local.xcconfig ignorado
# por git con el Team ID de cada quien (ver Local.xcconfig.example). Así
# regenerar no borra la firma, y sin ese archivo el simulador sigue
# compilando.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    # Xcode 27 trae Swift 6.4; el modo de lenguaje 5.10 evita que la
    # concurrencia estricta frene la fase. Se sube cuando todo esté acotado.
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # La API a la que habla la app; el Info.plist la lee de aquí. Se pisa
    # desde la línea de órdenes para el humo contra la API local:
    #   xcodebuild ... COCO_API_BASE_URL=http://localhost:3000
    COCO_API_BASE_URL: https://dev-cocoapp.viteri.me
    # Los catálogos (Localizable.xcstrings) se escriben a mano, con claves en
    # inglés. Sin esto, Xcode les añade solo cada literal que encuentra —un
    # `Text("$")`, los títulos de los intents— y el catálogo deja de ser la
    # lista de lo que pide `L10n`.
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Coco:
    type: application
    platform: iOS
    sources:
      - path: Coco
    dependencies:
      # La extensión de accesos rápidos (M13) va dentro del .app.
      - target: CocoWidgets
        embed: true
    info:
      path: Coco/Resources/Info.plist
      properties:
        CFBundleDisplayName: Coco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Esquema propio: los avisos, el widget y el control abren la app por aquí.
        CFBundleURLTypes:
          - CFBundleURLName: co.loatech.coco
            CFBundleURLSchemes: [coco]
        # Renovar el token tibio y vaciar la cola cuando iOS lo concede.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [co.loatech.coco.refresh, co.loatech.coco.queue]
        # Para poder abrir la app Atajos desde Bienvenida.
        LSApplicationQueriesSchemes: [shortcuts]
        NSCameraUsageDescription: Para fotografiar un recibo y leerlo.
        NSPhotoLibraryUsageDescription: Para adjuntar la foto de un recibo cuando no hay cámara.
        NSFaceIDUsageDescription: Para proteger tu sesión.
        # Solo red local sin TLS (la API en localhost desde el simulador); el
        # resto sigue exigiendo HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # La API a la que habla la app (ver COCO_API_BASE_URL arriba). Se
        # puede cambiar en Ajustes dentro de la app.
        CocoAPIBaseURL: $(COCO_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.loatech.coco
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  # Accesos rápidos (M13): el control del Centro de control / pantalla
  # bloqueada / botón de acción (iOS 18) y el widget de inicio + accesorios de
  # pantalla bloqueada (iOS 17). Solo abren la app por coco://, así que no
  # lleva entitlements (nada de App Groups: el equipo personal gratuito no los
  # garantiza). Consume el segundo App ID de los 10 por semana del equipo
  # personal.
  #
  # Si Xcode se niega a firmar la extensión con el equipo personal, se quita
  # este target y la dependencia de arriba: el botón de acción sigue
  # funcionando por los App Shortcuts de la app.
  CocoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CocoWidgets
    info:
      path: CocoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Accesos de Coco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.loatech.coco.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # Su propio catálogo con el mismo color de marca que la app: la
        # extensión no ve los recursos del .app.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  CocoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CocoTests
      # VisibleTextTests lee el código de la app y de la extensión. El
      # simulador no puede leerlo donde está (Documentos está protegido), así
      # que va copiado dentro del paquete de pruebas como carpeta.
      - path: Coco
        type: folder
        buildPhase: resources
      - path: CocoWidgets
        type: folder
        buildPhase: resources
    dependencies:
      - target: Coco
    info:
      path: CocoTests/Info.plist
      properties:
        # Una base distinta a la de la app, para probar que se lee del bundle
        # que se pide y no del de la app.
        CocoAPIBaseURL: https://pruebas.coco.invalid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.loatech.coco.tests
schemes:
  Coco:
    build:
      targets:
        Coco: all
        CocoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CocoTests]

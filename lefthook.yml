# Git hooks — CONTRIBUTING.md, "Git hooks". Installed by `npm install`
# (`prepare`); skipped in CI and on the server (NODE_ENV=production, where
# devDependencies — lefthook included — are not installed).
#
# Hooks are a convenience: CI runs the same checks and is the gate.
glob_matcher: doublestar

pre-commit:
  piped: true # stop at the first failure
  commands:
    0_gitleaks:
      # Secrets in what is about to be committed (step 7.11). CI scans the
      # whole history (security.yml); this stops the leak before it exists,
      # which is the only moment it costs nothing — once pushed, the secret
      # has to be rotated. gitleaks is a Go binary, not an npm package: if it
      # is missing, warn and let the commit through instead of blocking it.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1 .
        else
          echo "aviso: gitleaks no está instalado (brew install gitleaks); el commit sigue sin revisar secretos y CI lo revisará." >&2
        fi
    1_lint-staged:
      # eslint --fix + prettier --write on the staged files (lint-staged.config.js)
      run: npx lint-staged
    2_typecheck-api:
      glob: '{api/**/*.ts,packages/**/*.ts}'
      run: npm run typecheck --workspace api
    3_typecheck-web:
      glob: '{frontend/**/*.{ts,tsx},packages/**/*.ts}'
      run: npm run typecheck --workspace frontend
    4_typecheck-lectura:
      glob: 'packages/lectura/**/*.ts'
      run: npm run typecheck --workspace @coco/lectura
    6_lint-ios:
      # swift-format + SwiftLint, strict. Without Xcode or SwiftLint it warns
      # and lets the commit through: the iOS workflow (ios.yml) is the gate.
      glob: 'ios/**/*.swift'
      run: bash ios/scripts/lint.sh --if-installed

commit-msg:
  commands:
    commitlint:
      # Quoted: in a git worktree {1} is an absolute path, and this repo lives
      # under "VS Code" — unquoted, the space splits it into two arguments.
      run: npx commitlint --edit "{1}"

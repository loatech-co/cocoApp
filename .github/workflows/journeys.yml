# The critical journeys of the web, in Chromium (desktop and iPhone viewport),
# each with an axe check (plan §7.7, D16). See CONTRIBUTING.md, "Journeys".
#
# Its own workflow and not a step of `ci`: it needs both production builds and
# a browser, and a failure here reads differently from a failed unit test.
# It runs on every pull request; the whole job takes a few minutes, most of
# them installing Chromium and building.
name: journeys

on:
  pull_request:
    # A PR that only touches docs skips it (step R-1a); `hygiene` covers it.
    paths-ignore: ['docs/**', '.claude/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coco_migrate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coco_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Never a real secret: the journeys talk only to the throwaway Postgres
      # above and to a fake Supabase Auth inside the runner.
      E2E_DATABASE_URL: postgresql://coco_migrate:ci-only-password@localhost:5432/coco_e2e_pw_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # The API compresses an uploaded PDF with Ghostscript, as on the server;
      # without it the receipt journey gets a 415.
      - name: Ghostscript
        run: sudo apt-get install -y --no-install-recommends ghostscript

      - name: Build the API and the web
        run: npm run e2e:build

      - name: Journeys
        run: npm run e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journeys-report
          path: |
            e2e/.salida/informe
            e2e/.salida/resultados
          retention-days: 7

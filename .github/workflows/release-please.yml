# Versioning (phase 7.6, decision D21). On every push to the deploy branch,
# release-please reads the Conventional Commits since the last release and
# keeps one release PR open: version bump in package.json and CHANGELOG.md.
# Merging that PR tags vX.Y.Z and publishes the GitHub release notes.
#
# It runs with a fine-grained PAT (RELEASE_PLEASE_TOKEN) and not GITHUB_TOKEN:
# a PR opened with GITHUB_TOKEN does not trigger workflows, so ci.yml would
# never run on the release PR and scripts/merge.sh could not integrate it.
# Until the owner creates that secret AND sets the repository variable
# RELEASE_PLEASE_ENABLED=true, the job is skipped and bills nothing (step J-7;
# a job-level `if:` cannot read secrets, a variable it can).
name: release-please

on:
  push:
    branches: [Dev] # the deploy branch (D8)
  workflow_dispatch:

# Not cancelled midway (the one workflow without cancel-in-progress): a run
# cut while it tags a release can leave the tag without its GitHub release.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.RELEASE_PLEASE_ENABLED == 'true'
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: Dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# The gate every change passes before it reaches the deploy branch (phase 7.6).
#
# Mirrors what "done" means in this repo: typecheck, lint, format, knip, layering
# (dependency-cruiser), unit tests, API e2e against a real Postgres, both
# production builds, an install exactly like the server's (NODE_ENV=production,
# no devDependencies) and the browser journeys. scripts/merge.sh refuses to
# integrate a branch unless every check here is `pass` or `skipping`.
#
# One workflow, and every job on every pull request (step J-7, Actions quota).
# The first job, `hygiene`, also decides which areas the PR touches; the heavy
# jobs depend on it and are SKIPPED by `if:` when their area did not change. A
# skipped job still reports a check ("skipping", green for merge.sh) and costs
# nothing. A workflow filtered out by `paths` would report no check at all.
# Billing rounds every job UP to the minute, so the detection lives inside
# hygiene instead of a job of its own.
#
# Areas (anything outside a PR — a push to main, a manual run — is "all"):
#   all   package.json, package-lock.json, .github/, scripts/ci/, or any other
#         root-level file except *.md: lockfile, workflows and the configs every
#         tool reads (eslint, prettier, tsconfig, knip, size-limit…).
#   code  anything except docs/, .claude/, ios/ and *.md        → verify
#   api   all, api/, packages/, scripts/db/                     → API e2e, OpenAPI
#   web   all, frontend/, packages/                             → coverage, build
#   ui    all, frontend/src/shared/ui/, frontend/.storybook/, frontend/package.json
#   e2e   all, api/, frontend/, packages/, e2e/, scripts/db/    → journeys
#   prod  all, api/, frontend/, packages/, verify-clean-install → clean-install
#   ios   NOT all: ios/, frontend/src/shared/lib/{native-contract,bridge}.ts,
#         api/openapi.v2.json, this file, or a manual run          → ios (x10)
#
# Not on the push to Dev (step R-1a): merge.sh integrates by fast-forward, so
# the commit that lands is the one this already passed on its PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What every pull request passes, including one that only touches docs: it
  # still has commits to lint, files to format and, possibly, a secret pasted
  # into a handoff.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    outputs:
      code: ${{ steps.areas.outputs.code }}
      api: ${{ steps.areas.outputs.api }}
      web: ${{ steps.areas.outputs.web }}
      ui: ${{ steps.areas.outputs.ui }}
      e2e: ${{ steps.areas.outputs.e2e }}
      prod: ${{ steps.areas.outputs.prod }}
      ios: ${{ steps.areas.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the PR's range: areas, gitleaks and commitlint

      # Fails safe: if the diff cannot be read, every area counts as changed.
      - name: Areas the PR touches
        id: areas
        run: |
          all=false
          unknown=false # a PR whose diff could not be read
          if [ "$EVENT" != pull_request ]; then
            all=true
            files=''
          elif ! files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"; then
            all=true
            unknown=true
            files=''
          fi
          # Counts and here-strings, never `| grep -q`: under pipefail an early
          # exit of grep -q can turn a match into a SIGPIPE failure.
          count() { grep -cE "$1" <<<"$files" || true; }
          [ "$(count '^(package\.json|package-lock\.json|\.github/|scripts/ci/)')" -gt 0 ] && all=true
          [ "$(count '^[^/]+$')" -gt "$(count '^[^/]+\.md$')" ] && all=true
          code_files="$(grep -cvE '^(docs/|\.claude/|ios/)|\.md$|^$' <<<"$files" || true)"
          flag() {
            if [ "$all" = true ] || [ "$2" -gt 0 ]; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            flag code "$code_files"
            flag api "$(count '^(api/|packages/|scripts/db/)')"
            flag web "$(count '^(frontend/|packages/)')"
            flag ui "$(count '^(frontend/src/shared/ui/|frontend/\.storybook/|frontend/package\.json$)')"
            flag e2e "$(count '^(api/|frontend/|packages/|e2e/|scripts/db/)')"
            flag prod "$(count '^(api/|frontend/|packages/|scripts/verify-clean-install\.sh$)')"
            # iOS does NOT follow `all`: a macOS minute bills as ten, and the
            # lockfile or another workflow changes nothing it reads. Only its
            # own files, what its tests copy from the web, its job, and a
            # manual run. Never on a push: it already passed on the PR.
            ios_files="$(count '^(ios/|frontend/src/shared/lib/(native-contract|bridge)\.ts$|api/openapi\.v2\.json$|\.github/workflows/ci\.yml$)')"
            if [ "$EVENT" = workflow_dispatch ] || [ "$unknown" = true ] || [ "$ios_files" -gt 0 ]; then
              echo ios=true
            else
              echo ios=false
            fi
          } | tee -a "$GITHUB_OUTPUT"

      # Only the commits this PR adds. The whole history is scanned weekly
      # (security.yml); scanning it on every PR re-read the same past each time.
      - name: Secrets in the PR's commits (gitleaks)
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.event_name == 'pull_request'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Commit messages (commitlint)
        if: github.event_name == 'pull_request'
        run: npx commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

      # The files the PR changes, and only those: `verify` checks the whole
      # tree when it runs, and when it does not (a docs PR), the rest of the
      # tree is what it already checked. Prettier honours .prettierignore.
      - name: Format of the changed files (prettier)
        if: github.event_name == 'pull_request'
        run: |
          git diff -z --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" \
            | xargs -0 -r npx prettier --check --ignore-unknown

  verify:
    needs: hygiene
    # Also when hygiene failed (a commit message, say): its areas are already
    # decided, and the author learns every failure from one push.
    if: ${{ !cancelled() && needs.hygiene.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # An empty image skips the service: without API changes no step below
        # touches the database.
        image: ${{ needs.hygiene.outputs.api == 'true' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: coco_migrate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: coco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coco_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      API: ${{ needs.hygiene.outputs.api }}
      # Never a real secret: CI talks only to the throwaway Postgres above.
      TEST_DATABASE_URL: postgresql://coco_migrate:ci-only-password@localhost:5432/coco_test
      # The API runs as coco_app, under row-level security, so the e2e suites
      # test the policies too (ADR 0019). Migrations and fixtures stay owner.
      COCO_APP_DB_PASSWORD: ci-only-coco-app-password
      TEST_APP_DATABASE_URL: postgresql://coco_app:ci-only-coco-app-password@localhost:5432/coco_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the Spanish names baseline diffs the PR against its base

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test environment (api/.env.test)
        if: env.API == 'true'
        run: |
          {
            echo 'NODE_ENV=test'
            echo "DATABASE_URL=$TEST_APP_DATABASE_URL"
            echo "DIRECT_URL=$TEST_DATABASE_URL"
            echo 'CORS_ORIGINS=http://localhost:5173'
            echo 'LOG_LEVEL=silent'
            echo 'JWT_SECRET=ci-only-jwt-secret-at-least-32-characters-long'
            echo 'CHECK_BREACHED_PASSWORDS=false'
            echo 'BOOTSTRAP_ADMIN_EMAIL=admin-e2e@pruebas.coco'
            echo 'RECEIPTS_DIR=.soportes-test'
          } > api/.env.test

      - name: Application role (coco_app)
        if: env.API == 'true'
        run: bash scripts/db/create-app-role.sh
        env:
          ADMIN_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # The client always (the API's typecheck reads it); the database only
      # when the API suites run.
      - name: Prisma client
        run: npm run prisma:generate --workspace api

      - name: Test database
        if: env.API == 'true'
        run: npm run db:test:push --workspace api

      # The web's API client (D11) is generated by Orval from api/openapi.v2.json
      # and committed, because hbuilds builds without devDependencies. Regenerate
      # it and fail if anything differs: a contract change without its client, or
      # a hand edit inside generated/. Before the typecheck, so a stale client is
      # reported as what it is.
      - name: Web API client matches the contract
        run: |
          npm run generate:api --workspace frontend
          git diff --exit-code -- frontend/src/shared/api/generated
          test -z "$(git status --porcelain -- frontend/src/shared/api/generated)"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm run lint` above already fails on a NEW Spanish name (step 7.2-a).
      # This also fails if the PR made the baseline hold more of any name than
      # its base: the baseline moves between folders, but only shrinks.
      - name: Spanish names baseline only shrinks
        if: github.event_name == 'pull_request'
        run: npm run lint:spanish -- --against "${{ github.event.pull_request.base.sha }}"

      - name: Format
        run: npx prettier --check .

      - name: Unused code and dependencies (knip)
        run: npm run knip

      - name: Architecture rules (dependency-cruiser)
        run: npm run depcruise

      - name: Feature flag expiry (warns past removeBy, fails 30 days later)
        run: node scripts/ci/flags-expiry.mjs

      - name: Dependency audit (high/critical, production deps)
        run: node scripts/ci/audit.mjs

      # Each suite once (step R-1a). `npm test` at the root would also run the
      # frontend's and the API's unit tests, which run again below: the
      # frontend's under coverage, the API's inside test:cov with the e2e.
      - name: Unit tests (packages)
        run: npm test --workspace packages --if-present

      # Fails under the thresholds in frontend/vitest.config.ts. They only go up.
      - name: Frontend coverage
        if: needs.hygiene.outputs.web == 'true'
        run: npm run test:coverage --workspace frontend

      # The e2e suite runs here, together with the unit one: coverage of
      # api/src is measured over both, and the job fails below 80 % of lines
      # or branches (api/jest.coverage.config.js). packages/receipt-parser checks its
      # own floor inside `npm test`.
      - name: API e2e and coverage
        if: env.API == 'true'
        run: npm run test:cov --workspace api

      - name: API production build
        if: env.API == 'true'
        run: npm run build --workspace api

      - name: Web production build
        if: needs.hygiene.outputs.web == 'true'
        run: NODE_ENV=production npm run build --workspace frontend

      # Step 7.9 (D26): the initial bundle must stay under its budget. Reads
      # the production build above; the budget lives in .size-limit.cjs.
      - name: Bundle budget (size-limit)
        if: needs.hygiene.outputs.web == 'true'
        run: npx size-limit

      # The component catalogue (CONTRIBUTING, "Component catalogue"). Built
      # so a story that stops compiling fails here and not when someone opens
      # it. It needs no network and no data: stories never fetch. Every story
      # lives in shared/ui.
      - name: Component catalogue (Storybook)
        if: needs.hygiene.outputs.ui == 'true'
        run: npm run build-storybook --workspace frontend

      # The contract (step 7.4): one document per served version —only
      # api/openapi.v2.json since v1 was retired (7.10)—, regenerated from the
      # code (no database, no secrets); it must match the committed one, so a PR
      # that changes the contract carries its document. The regenerated file is
      # kept as an artifact, also when the comparison fails.
      - name: OpenAPI document matches the code
        if: env.API == 'true'
        run: |
          npm run openapi --workspace api
          git diff --exit-code -- api/openapi.v2.json

      - name: OpenAPI artifact
        if: ${{ !cancelled() && env.API == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi
          path: api/openapi.v2.json

  clean-install:
    # What hbuilds runs on every deploy: a fresh install with NODE_ENV=production
    # (no devDependencies) and the build. Three deploys failed on exactly this.
    needs: hygiene
    if: ${{ !cancelled() && needs.hygiene.outputs.prod == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Clean install and production build
        run: bash scripts/verify-clean-install.sh

  # The critical journeys of the web, in Chromium (desktop and iPhone viewport),
  # each with an axe check (plan §7.7, D16). See CONTRIBUTING.md, "Journeys".
  # Its own job: it needs both production builds and a browser, and a failure
  # here reads differently from a failed unit test.
  journeys:
    needs: hygiene
    if: ${{ !cancelled() && needs.hygiene.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coco_migrate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coco_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Never a real secret: the journeys talk only to the throwaway Postgres
      # above and to a fake Supabase Auth inside the runner.
      E2E_DATABASE_URL: postgresql://coco_migrate:ci-only-password@localhost:5432/coco_e2e_pw_test
      E2E_APP_DATABASE_URL: postgresql://coco_app:ci-only-coco-app-password@localhost:5432/coco_e2e_pw_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser, by Playwright version: downloading it was over a minute.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium's system libraries, and Ghostscript: the API compresses an
      # uploaded PDF with it, as on the server; without it the receipt journey
      # gets a 415. The runner rebuilds the man-db index after every apt
      # install, and that alone took two minutes: it is switched off first.
      - name: Chromium and Ghostscript
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ghostscript

      - name: Application role (coco_app)
        run: bash scripts/db/create-app-role.sh
        env:
          ADMIN_DATABASE_URL: postgresql://coco_migrate:ci-only-password@localhost:5432/postgres
          COCO_APP_DB_PASSWORD: ci-only-coco-app-password

      - name: Build the API and the web
        run: npm run e2e:build

      - name: Journeys
        run: npm run e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journeys-report
          path: |
            e2e/.salida/informe
            e2e/.salida/resultados
          retention-days: 7

  # The iOS gate (phase 7.6 / 7.13): swift-format, SwiftLint, the generated
  # project and the XCTest suite on the simulator. A macOS minute bills as ten
  # (step J-7), so it runs only when the `ios` area changed — see the top.
  # WebBridgeSmokeTests skip themselves here: they load `frontend/dist`, which
  # this job does not build (building it on macOS would bill ten times over).
  ios:
    needs: hygiene
    if: ${{ !cancelled() && needs.hygiene.outputs.ios == 'true' }}
    runs-on: macos-26
    # Measured 9 min 38 s (step J-7, PR #110), almost all of it the simulator
    # build and tests. A hung run bills ten times its timeout.
    timeout-minutes: 14
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and the pinned SwiftLint
        run: |
          brew install xcodegen
          version="$(sed -n 's/^swiftlint_version: *//p' .swiftlint.yml)"
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: swift-format and SwiftLint
        run: bash scripts/lint.sh

      - name: The generated project matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Coco.xcodeproj

      - name: Tests on the simulator
        run: |
          device="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')"
          echo "Simulator: $device"
          xcodebuild test -scheme Coco -destination "platform=iOS Simulator,name=$device" \
            CODE_SIGNING_ALLOWED=NO | tail -n 50
          exit "${PIPESTATUS[0]}"

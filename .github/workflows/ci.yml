# The gate every change passes before it reaches the deploy branch (phase 7.6).
#
# Mirrors what "done" means in this repo: typecheck, lint, format, knip, layering
# (dependency-cruiser), unit tests, API e2e
# against a real Postgres, both production builds, and an install exactly like
# the server's (NODE_ENV=production, no devDependencies). scripts/merge.sh
# refuses to integrate a branch unless this is green.
name: ci

on:
  pull_request:
  push:
    branches: [Dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coco_migrate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: coco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coco_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Never a real secret: CI talks only to the throwaway Postgres above.
      TEST_DATABASE_URL: postgresql://coco_migrate:ci-only-password@localhost:5432/coco_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint reads the PR's commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test environment (api/.env.test)
        run: |
          {
            echo 'NODE_ENV=test'
            echo "DATABASE_URL=$TEST_DATABASE_URL"
            echo "DIRECT_URL=$TEST_DATABASE_URL"
            echo 'CORS_ORIGINS=http://localhost:5173'
            echo 'LOG_LEVEL=silent'
            echo 'JWT_SECRET=ci-only-jwt-secret-at-least-32-characters-long'
            echo 'CHECK_BREACHED_PASSWORDS=false'
            echo 'BOOTSTRAP_ADMIN_EMAIL=admin-e2e@pruebas.coco'
            echo 'SOPORTES_DIR=.soportes-test'
          } > api/.env.test

      - name: Prisma client and test database
        run: |
          npm run prisma:generate --workspace api
          npm run db:test:push --workspace api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check .

      - name: Unused code and dependencies (knip)
        run: npm run knip

      - name: Architecture rules (dependency-cruiser)
        run: npm run depcruise

      - name: Commit messages (commitlint)
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Feature flag expiry (warns past removeBy, fails 30 days later)
        run: node scripts/ci/flags-expiry.mjs

      - name: Dependency audit (high/critical, production deps)
        run: node scripts/ci/audit.mjs

      - name: Unit tests
        run: npm test

      # Fails under the thresholds in frontend/vitest.config.ts. They only go up.
      - name: Frontend coverage
        run: npm run test:coverage --workspace frontend

      # The e2e suite runs here, together with the unit one: coverage of
      # api/src is measured over both, and the job fails below 80 % of lines
      # or branches (api/jest.coverage.config.js). packages/lectura checks its
      # own floor inside `npm test`.
      - name: API e2e and coverage
        run: npm run test:cov --workspace api

      - name: Production builds
        run: |
          npm run build --workspace api
          NODE_ENV=production npm run build --workspace frontend

      # Step 7.9 (D26): the initial bundle must stay under its budget. Reads
      # the production build above; the budget lives in .size-limit.cjs.
      - name: Bundle budget (size-limit)
        run: npx size-limit

      # The component catalogue (CONTRIBUTING, "Component catalogue"). Built
      # so a story that stops compiling fails here and not when someone opens
      # it. It needs no network and no data: stories never fetch.
      - name: Component catalogue (Storybook)
        run: npm run build-storybook --workspace frontend

      # The contracts (step 7.4): one document per version, api/openapi.v1.json
      # and api/openapi.v2.json, regenerated from the code (no database, no
      # secrets); each must match the committed one, so a PR that changes a
      # contract carries its document. The regenerated files are kept as an
      # artifact, also when the comparison fails.
      - name: OpenAPI documents match the code
        run: |
          npm run openapi --workspace api
          git diff --exit-code -- api/openapi.v1.json api/openapi.v2.json

      - name: OpenAPI artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            api/openapi.v1.json
            api/openapi.v2.json

  clean-install:
    # What hbuilds runs on every deploy: a fresh install with NODE_ENV=production
    # (no devDependencies) and the build. Three deploys failed on exactly this.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install and production build
        run: bash scripts/verify-clean-install.sh

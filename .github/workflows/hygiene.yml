# What every pull request passes, including one that only touches docs (step R-1a).
#
# `ci` and `journeys` skip a PR whose files are all under docs/, .claude/ or
# end in .md (paths-ignore), to save Actions minutes. But scripts/merge.sh
# refuses a PR with no checks at all, and a docs PR still has commits to lint,
# files to format and, possibly, a secret pasted into a handoff. So this runs
# on EVERY pull request and is the one check a docs PR always has.
#
# One job on purpose: GitHub bills each job rounded up to the minute, and all
# of this fits in less than one.
name: hygiene

on:
  pull_request:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the PR's range, for gitleaks and commitlint

      # Only the commits this PR adds. The whole history is scanned weekly
      # (security.yml); scanning it on every PR re-read the same past each time.
      - name: Secrets in the PR's commits (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Commit messages (commitlint)
        run: npx commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

      # The files the PR changes, and only those: `ci` checks the whole tree
      # when it runs, and when it does not (a docs PR), the rest of the tree is
      # what it already checked. Prettier honours .prettierignore.
      - name: Format of the changed files (prettier)
        run: |
          git diff -z --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" \
            | xargs -0 -r npx prettier --check --ignore-unknown

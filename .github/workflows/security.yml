# Secrets in the WHOLE history and known-vulnerable dependencies (phase 7.6).
# Weekly and on demand.
#
# Not on pull requests (step R-1a, Actions quota): there, `hygiene` scans only
# the commits the PR adds and `ci` runs the audit. What this catches that the
# PR checks cannot is what changes without a commit: a new advisory against a
# dependency already installed, or a gitleaks rule that now recognises an old
# leak.
name: security

on:
  schedule:
    - cron: '0 11 * * 1' # Mondays 06:00 Bogotá
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job (step J-7): billing rounds each job up to the minute, and both
  # checks together take well under one.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The gitleaks CLI and not its GitHub Action: the action needs a paid
      # license for organization-owned repositories; the CLI is MIT and free.
      - name: Secrets in the whole history (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: High/critical advisories in production dependencies
        if: ${{ !cancelled() }}
        run: node scripts/ci/audit.mjs

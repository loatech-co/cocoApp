name: Improvement
description: A new capability, or a better way to do something that already exists.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, ios, receipt-parser, flags, ci]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow or missing today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Screens and text the user sees, in Spanish.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Needs a database migration (additive, applied before the code)
        - label: Goes behind a feature flag
        - label: Decides something new (needs an ADR)
